# Cấu hình Railway cho frontend. Đặt Root Directory của service là FE_TKB.
# NEXT_PUBLIC_API_URL được nướng vào bản build: đổi biến này thì phải deploy lại.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
