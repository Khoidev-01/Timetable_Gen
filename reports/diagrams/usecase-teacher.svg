<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1040" width="1200" height="1040">
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#111827}.title{font-size:25px;font-weight:700}.label{font-size:16px;font-weight:600}.small{font-size:13px}.field{font-size:12px}.muted{fill:#6b7280}</style>
<defs>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#94a3b8" flood-opacity=".25"/></filter>
<marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
<marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748b"/></marker>
</defs>
<rect width="1200" height="1040" fill="#ffffff"/>
<text x="600.0" y="38" text-anchor="middle" class="title">Sơ đồ use case – Giáo viên và tổ trưởng chuyên môn</text>
<rect x="255" y="72" width="690" height="900" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="9 6"/>
<text x="282" y="104" class="label" fill="#334155">Hệ thống MiKiTimetable</text>
<g stroke="#111827" stroke-width="3" fill="none">
<circle cx="110" cy="440" r="18" fill="#eff6ff"/>
<line x1="110" y1="458" x2="110" y2="518"/>
<line x1="80" y1="483" x2="140" y2="483"/>
<line x1="110" y1="518" x2="82" y2="562"/>
<line x1="110" y1="518" x2="138" y2="562"/>
</g>
<text x="110" y="590" text-anchor="middle" class="label">
<tspan x="110" dy="0">Giáo viên</tspan>
</text>
<g stroke="#111827" stroke-width="3" fill="none">
<circle cx="1080" cy="440" r="18" fill="#eff6ff"/>
<line x1="1080" y1="458" x2="1080" y2="518"/>
<line x1="1050" y1="483" x2="1110" y2="483"/>
<line x1="1080" y1="518" x2="1052" y2="562"/>
<line x1="1080" y1="518" x2="1108" y2="562"/>
</g>
<text x="1080" y="590" text-anchor="middle" class="label">
<tspan x="1080" dy="0">Quản trị viên</tspan>
</text>
<ellipse cx="600" cy="150" rx="210" ry="38" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" filter="url(#shadow)"/>
<text x="600" y="146" text-anchor="middle" class="label">
<tspan x="600" dy="0">Đăng nhập 2 bước</tspan>
<tspan x="600" dy="19">(mật khẩu + mã email)</tspan>
</text>
<path d="M140,483 L390,150" fill="none" stroke="#64748b" stroke-width="1.8"/>
<ellipse cx="600" cy="242" rx="210" ry="38" fill="#f0fdf4" stroke="#93c5fd" stroke-width="2" filter="url(#shadow)"/>
<text x="600" y="238" text-anchor="middle" class="label">
<tspan x="600" dy="0">Cập nhật tài khoản</tspan>
<tspan x="600" dy="19">của tôi, ảnh đại diện</tspan>
</text>
<path d="M140,483 L390,242" fill="none" stroke="#64748b" stroke-width="1.8"/>
<ellipse cx="600" cy="334" rx="210" ry="38" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" filter="url(#shadow)"/>
<text x="600" y="330" text-anchor="middle" class="label">
<tspan x="600" dy="0">Xem lịch hôm nay và</tspan>
<tspan x="600" dy="19">thời khóa biểu cá nhân</tspan>
</text>
<path d="M140,483 L390,334" fill="none" stroke="#64748b" stroke-width="1.8"/>
<ellipse cx="600" cy="426" rx="210" ry="38" fill="#f0fdf4" stroke="#93c5fd" stroke-width="2" filter="url(#shadow)"/>
<text x="600" y="422" text-anchor="middle" class="label">
<tspan x="600" dy="0">Đăng ký lịch bận</tspan>
<tspan x="600" dy="19">và nguyện vọng</tspan>
</text>
<path d="M140,483 L390,426" fill="none" stroke="#64748b" stroke-width="1.8"/>
<ellipse cx="600" cy="518" rx="210" ry="38" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" filter="url(#shadow)"/>
<text x="600" y="514" text-anchor="middle" class="label">
<tspan x="600" dy="0">Đề xuất / phản hồi</tspan>
<tspan x="600" dy="19">đổi tiết</tspan>
</text>
<path d="M140,483 L390,518" fill="none" stroke="#64748b" stroke-width="1.8"/>
<ellipse cx="600" cy="610" rx="210" ry="38" fill="#f0fdf4" stroke="#93c5fd" stroke-width="2" filter="url(#shadow)"/>
<text x="600" y="606" text-anchor="middle" class="label">
<tspan x="600" dy="0">Nhận thông báo,</tspan>
<tspan x="600" dy="19">hỏi trợ lý AI</tspan>
</text>
<path d="M140,483 L390,610" fill="none" stroke="#64748b" stroke-width="1.8"/>
<ellipse cx="600" cy="702" rx="210" ry="38" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" filter="url(#shadow)"/>
<text x="600" y="698" text-anchor="middle" class="label">
<tspan x="600" dy="0">Tổ trưởng: tải mẫu,</tspan>
<tspan x="600" dy="19">nộp phân công của tổ</tspan>
</text>
<path d="M140,483 L390,702" fill="none" stroke="#64748b" stroke-width="1.8"/>
<ellipse cx="600" cy="794" rx="210" ry="38" fill="#f0fdf4" stroke="#93c5fd" stroke-width="2" filter="url(#shadow)"/>
<text x="600" y="790" text-anchor="middle" class="label">
<tspan x="600" dy="0">Quét QR xem TKB</tspan>
<tspan x="600" dy="19">không cần tài khoản</tspan>
</text>
<path d="M140,483 L390,794" fill="none" stroke="#64748b" stroke-width="1.8"/>
<path d="M1048,483 L810,518" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-gray)"/>
<path d="M1048,483 L810,610" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-gray)"/>
<path d="M1048,483 L810,794" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow-gray)"/>
<g transform="translate(300,1000)"><line x1="0" y1="0" x2="38" y2="0" stroke="#64748b" stroke-width="2"/><text x="48" y="5" class="small muted">Tương tác trực tiếp</text><line x1="240" y1="0" x2="278" y2="0" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-gray)"/><text x="288" y="5" class="small muted">Phối hợp/duyệt</text></g>
</svg>